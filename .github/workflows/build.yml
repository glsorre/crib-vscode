name: Build

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Lint
        run: npm run lint

      - name: Test
        run: xvfb-run -a npm test

      - name: Package main extension (smoke check)
        run: npx --yes @vscode/vsce package --no-dependencies -o "$RUNNER_TEMP/main.vsix"

      - name: Package attach bridge (smoke check)
        working-directory: ui-bridge
        run: npx --yes @vscode/vsce package -o "$RUNNER_TEMP/bridge.vsix"
