name: Build

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Lint
        run: npm run lint

      - name: Test
        run: xvfb-run -a npm test

      - name: Package main extension (smoke check)
        run: npx --yes @vscode/vsce package --no-dependencies -o "$RUNNER_TEMP/main.vsix"

      - name: Verify runtime deps are bundled into the VSIX
        # The extension is bundled with esbuild, so dependencies must be inlined.
        # If a runtime require survives, the published extension fails to activate
        # with "Cannot find module ..." (see 0.1.6 jsonc-parser regression).
        run: |
          set -euo pipefail
          unzip -l "$RUNNER_TEMP/main.vsix" | grep -q "extension/dist/extension.js"
          if unzip -p "$RUNNER_TEMP/main.vsix" extension/dist/extension.js | grep -q 'require("jsonc-parser")'; then
            echo "::error::jsonc-parser is required at runtime but not bundled into the VSIX"
            exit 1
          fi

      - name: Package attach bridge (smoke check)
        working-directory: ui-bridge
        run: npx --yes @vscode/vsce package -o "$RUNNER_TEMP/bridge.vsix"
