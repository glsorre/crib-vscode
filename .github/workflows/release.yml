name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Package main extension
        run: npx --yes @vscode/vsce package --no-dependencies -o crib-vscode-main.vsix

      - name: Package attach bridge
        working-directory: ui-bridge
        run: npx --yes @vscode/vsce package -o ../crib-vscode-attach-bridge.vsix

      # Each extension versions independently (the bridge is effectively frozen
      # at its current version while the main extension iterates). Publish each
      # at its own package.json version and skip any version already on the
      # registry, so an unchanged extension doesn't fail the release.
      - name: Publish to Visual Studio Marketplace and Open VSX
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          set -u
          publish() {
            local out status
            out=$("$@" 2>&1); status=$?
            printf '%s\n' "$out"
            if [ "$status" -ne 0 ]; then
              if printf '%s' "$out" | grep -qiE "already (exists|published)"; then
                echo "::warning::Version already published; skipping."
                return 0
              fi
              return "$status"
            fi
          }
          publish npx --yes @vscode/vsce publish --packagePath crib-vscode-main.vsix -p "$VSCE_PAT"
          publish npx --yes @vscode/vsce publish --packagePath crib-vscode-attach-bridge.vsix -p "$VSCE_PAT"
          publish npx --yes ovsx publish crib-vscode-main.vsix -p "$OVSX_PAT"
          publish npx --yes ovsx publish crib-vscode-attach-bridge.vsix -p "$OVSX_PAT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            crib-vscode-main.vsix
            crib-vscode-attach-bridge.vsix
