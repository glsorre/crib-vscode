name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Package main extension
        run: npx --yes @vscode/vsce package --no-dependencies -o crib-vscode-main.vsix

      - name: Package attach bridge
        working-directory: ui-bridge
        run: npx --yes @vscode/vsce package -o ../crib-vscode-attach-bridge.vsix

      - name: Publish main extension to Visual Studio Marketplace
        run: npx --yes @vscode/vsce publish --packagePath crib-vscode-main.vsix -p "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish attach bridge to Visual Studio Marketplace
        run: npx --yes @vscode/vsce publish --packagePath crib-vscode-attach-bridge.vsix -p "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish main extension to Open VSX
        run: npx --yes ovsx publish crib-vscode-main.vsix -p "$OVSX_PAT"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: Publish attach bridge to Open VSX
        run: npx --yes ovsx publish crib-vscode-attach-bridge.vsix -p "$OVSX_PAT"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            crib-vscode-main.vsix
            crib-vscode-attach-bridge.vsix
